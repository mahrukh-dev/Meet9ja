  flutter_launcher_icons: ^0.14.4
  font_awesome_flutter: ^10.7.0
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.3
  image_picker: ^1.2.0
  path: ^1.9.1
  permission_handler: ^12.0.1
  video_player: ^2.10.0
  camera: ^0.11.2
  zego_zim: ^2.21.1+2
  zego_uikit_prebuilt_video_conference: ^2.10.3
  zego_uikit_prebuilt_live_streaming: ^3.14.6

  zego_uikit_prebuilt_call: ^4.14.0
  zego_uikit: 2.28.28
  zego_zimkit: ^1.4.0
  zego_uikit_signaling_plugin: ^2.6.0

  url_launcher: ^6.3.2
